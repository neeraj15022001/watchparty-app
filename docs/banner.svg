<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#181b29"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Background Grid Glow -->
  <circle cx="950" cy="180" r="280" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="300" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Cinema Projection Rays -->
  <path d="M 0 0 L 480 200 L 0 420 Z" fill="url(#gridGrad)" opacity="0.4"/>

  <!-- Brand Badge -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="84" height="28" rx="6" fill="url(#badgeGrad)"/>
    <text x="42" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    WatchParty <tspan fill="url(#accentGrad)">Pro</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    Zero-Degradation Collaborative Cinema &amp; Spatial Voice
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="210" height="38" rx="19" fill="#1e2235" stroke="#333954" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Native 4K / HDR OTT</text>

    <rect x="225" y="0" width="200" height="38" rx="19" fill="#1e2235" stroke="#333954" stroke-width="1.2"/>
    <circle cx="245" cy="19" r="6" fill="#6366f1"/>
    <text x="261" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">&lt;200ms NTP Sync</text>

    <rect x="440" y="0" width="185" height="38" rx="19" fill="#1e2235" stroke="#333954" stroke-width="1.2"/>
    <circle cx="460" cy="19" r="6" fill="#ec4899"/>
    <text x="476" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">WebRTC Mesh A/V</text>

    <rect x="640" y="0" width="195" height="38" rx="19" fill="#1e2235" stroke="#333954" stroke-width="1.2"/>
    <circle cx="660" cy="19" r="6" fill="#f59e0b"/>
    <text x="676" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Smart Voice Ducking</text>
  </g>

  <!-- Subtext footer -->
  <text x="100" y="345" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
    Open Source &bull; Zero Server Video Transcoding &bull; Pure Python &amp; Modern Web
  </text>

  <!-- Illustration / Theater Graphic (Right) -->
  <g transform="translate(860, 90)">
    <rect x="30" y="0" width="260" height="160" rx="12" fill="#131622" stroke="#333954" stroke-width="2"/>
    <rect x="42" y="12" width="236" height="136" rx="8" fill="#08090f"/>
    <circle cx="160" cy="80" r="28" fill="url(#accentGrad)"/>
    <polygon points="152,66 174,80 152,94" fill="#ffffff"/>

    <circle cx="15" cy="140" r="18" fill="#6366f1" stroke="#0f111a" stroke-width="3"/>
    <circle cx="45" cy="165" r="15" fill="#10b981" stroke="#0f111a" stroke-width="3"/>
    <circle cx="280" cy="145" r="18" fill="#ec4899" stroke="#0f111a" stroke-width="3"/>
  </g>
</svg>
