<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1119;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #6366f1;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1c1f2e;
      border: 1px solid #272a3d;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      background: #6366f1;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #10b981;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>WatchParty Pro</h3>
  <label for="room-id">Room ID:</label>
  <input type="text" id="room-id" value="cinema-room-1" />

  <label for="server-host">Signaling Server:</label>
  <input type="text" id="server-host" value="localhost:8080" />

  <div class="toggle-row">
    <span>Enable Playback Sync</span>
    <input type="checkbox" id="sync-enabled" checked />
  </div>

  <button id="save-btn">Save & Reconnect</button>
  <div class="status" id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
